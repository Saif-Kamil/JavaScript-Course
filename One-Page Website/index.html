<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio with Lightbox</title>
    <style>
        /* --- General & Layout --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; scroll-behavior: smooth; }

        nav {
            position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95);
            padding: 1rem; text-align: center; border-bottom: 1px solid #1e293b; z-index: 1000;
        }
        nav a { color: #38bdf8; margin: 0 15px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: #f8fafc; }

        section { padding: 100px 20px; max-width: 1000px; margin: auto; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 1rem; color: #38bdf8; }
        p { margin-bottom: 2rem; color: #94a3b8; }

        /* --- Gallery & Images --- */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .gallery img { 
            width: 100%; border-radius: 12px; cursor: pointer;
            transition: transform 0.3s ease; border: 2px solid #1e293b; 
        }
        .gallery img:hover { transform: scale(1.03); border-color: #38bdf8; }

        /* --- Lightbox / Modal Styling --- */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; z-index: 2000; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9);
            justify-content: center; align-items: center;
        }
        .modal-content {
            max-width: 80%; max-height: 80%;
            border-radius: 8px; border: 3px solid #38bdf8;
            animation: zoom 0.3s ease;
        }
        @keyframes zoom { from {transform: scale(0.7)} to {transform: scale(1)} }
        
        .close-btn {
            position: absolute; top: 30px; right: 40px;
            color: white; font-size: 40px; font-weight: bold; cursor: pointer;
        }

        /* --- Video & Form (Standard) --- */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        form { background: #1e293b; padding: 2rem; border-radius: 12px; max-width: 500px; margin: auto; text-align: left; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0 20px; border-radius: 6px; border: none; background: #334155; color: white; }
        button { background: #38bdf8; color: #0f172a; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

        footer { padding: 40px; text-align: center; border-top: 1px solid #1e293b; color: #64748b; }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#video">Video</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Creative Vision</h1>
        <p>A modern showcase featuring an interactive lightbox gallery.</p>
    </section>

    <section id="gallery">
        <h2>Photo Gallery</h2>
        <p>Click any image to expand it.</p>
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" alt="Workspace" onclick="openModal(this.src)">
            <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800" alt="Coding" onclick="openModal(this.src)">
            <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800" alt="Laptop" onclick="openModal(this.src)">
        </div>
    </section>

    <div id="myModal" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <section id="video">
        <h2>Project Showcase</h2>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video" allowfullscreen></iframe>
        </div>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <form>
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <textarea rows="4" placeholder="Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Modern Web Design</p>
    </footer>

    <script>
        function openModal(src) {
            document.getElementById("myModal").style.display = "flex";
            document.getElementById("modalImg").src = src;
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
    </script>

</body>
</html>
